    <!-- Portada con carrusel -->
    <header>
        <div class="carrusel">

            <div class="letreroCarrucel">
                <p> Gran, gran reinaguracion </p>
            </div>

            <!-- Flecha anterior -->
            <button
                class="flecha anterior"
                onclick="moverCarrusel(-1)"
                aria-label="Imagen anterior"
            >
                &#10094;
            </button>

            <!-- Diapositivas -->
            <div class="diapositivas" id="diapositivas">

                <img
                    src="/Bob's burgers/assets/imagenes/Portada.png"
                    alt="Portada de Bob's Burgers"
                >

                Cuarta portada de Bob's Burgers">

                <img src="/Bob's burgers/assets/imagenes/Portada6.png" alt="
                Quinta portada de Bob's Burgers">

            </div>

            <!-- Flecha siguiente -->
            <button
                class="flecha siguiente"
                onclick="moverCarrusel(1)"
                aria-label="Imagen siguiente"
            >
                &#10095;
            </button>

        </div>
    </header>

    <script>
        let indice = 0;

        function moverCarrusel(direccion) {
            const diapositivas = document.getElementById("diapositivas");
            const total = diapositivas.children.length;

            indice = (indice + direccion + total) % total;

            diapositivas.style.transform =
                `translateX(-${indice * 100}%)`;
        }
    </script>
